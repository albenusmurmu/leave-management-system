<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <button class="topbar__link is-active">My Data</button>
    <button class="topbar__link">Team</button>
    <button class="topbar__link">Holidays</button>
  </header>

  <nav class="subtabs" id="subtabs">
    <button class="subtabs__tab is-active" data-tab="summary">Leave Summary</button>
    <button class="subtabs__tab" data-tab="requests">Leave Requests</button>
    <button class="subtabs__tab" data-tab="compoff">Compensatory Request</button>
  </nav>

  <main class="content">

    <section class="tab-panel is-active" id="tab-summary">

      <!-- STICKY BAR -->
      <div class="summary-bar">
        <div class="summary-bar__info">
          Leave booked this year : <b id="leaveBooked">0</b>
          <span class="divider">|</span>
          Absent : <b id="absentDays">0 day(s)</b>
        </div>

        <div class="year-nav">
          <div class="year-nav__buttons">
            <button class="icon-btn" id="prevYear" title="Previous">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="icon-btn" id="todayBtn" title="Today">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </button>
            <button class="icon-btn" id="nextYear" title="Next">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <span class="year-nav__range" id="dateRange"></span>
        </div>

        <div class="summary-bar__actions">
          <button class="view-btn is-active" data-view="list" title="List view">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
          </button>
          <button class="view-btn" data-view="calendar" title="Calendar view">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <button class="btn-primary" id="applyLeaveBtn">Apply Leave</button>
          <button class="btn-more" id="moreBtn" title="More">•••</button>
        </div>
      </div>

      <!-- LIST VIEW -->
      <div id="listView">

        <!-- LEAVE CARDS -->
        <div class="cards" id="cards"></div>

        <!-- ABSENT LIST -->
        <div class="panel">
          <div class="panel__head">
            <b>Absent</b><span class="dot"></span><span id="absentTitle" class="muted"></span>
          </div>
          <div class="absent-rows" id="absentRows"></div>
        </div>

        <!-- AGENDA: upcoming / past leaves and holidays -->
        <div class="panel">
          <div class="agenda-head">
            <div class="seg" id="periodSeg">
              <button class="seg__btn is-active" data-period="upcoming">Upcoming</button>
              <button class="seg__btn" data-period="past">Past</button>
            </div>
            <div class="chips" id="kindChips">
              <button class="chip is-active" data-kind="all">All</button>
              <button class="chip" data-kind="leave">Leaves</button>
              <button class="chip" data-kind="holiday">Holidays</button>
            </div>
          </div>
          <div class="agenda" id="agenda"></div>
        </div>

      </div>

      <!-- CALENDAR VIEW -->
      <div class="cal" id="calendarView" hidden>
        <div class="cal__week">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="cal__grid" id="calGrid"></div>
      </div>

    </section>

    <section class="tab-panel" id="tab-requests">Leave Requests content</section>
    <section class="tab-panel" id="tab-compoff">Compensatory Request content</section>
  </main>

  <!-- SYNC POPUP (calendar view, three dots) -->
  <div class="dialog" id="syncDialog" hidden>
    <div class="dialog__box">
      <div class="dialog__head">
        <h3>Choose Calendar to sync Leave and Holiday data</h3>
        <button class="dialog__close" id="syncClose" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
      <div class="dialog__body">
        <button class="sync-opt" data-provider="microsoft">
          <svg width="44" height="44" viewBox="0 0 24 24"><rect x="2" y="2" width="9.5" height="9.5" fill="#f25022"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#7fba00"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#00a4ef"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#ffb900"/></svg>
          <span>Microsoft 365</span>
        </button>
        <button class="sync-opt" data-provider="google">
          <svg width="44" height="44" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="19" rx="3" fill="#4285f4"/><rect x="5" y="9" width="14" height="10" rx="1.5" fill="#fff"/><text x="12" y="17.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4285f4" font-family="Arial">31</text></svg>
          <span>Google</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pages/calendarView.js"></script>
  <script src="js/pages/leaveSummary.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
