<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <button class="topbar__link is-active">My Data</button>
    <button class="topbar__link">Team</button>
    <button class="topbar__link">Holidays</button>
  </header>

  <nav class="subtabs" id="subtabs">
    <button class="subtabs__tab is-active" data-tab="summary">Leave Summary</button>
    <button class="subtabs__tab" data-tab="requests">Leave Requests</button>
    <button class="subtabs__tab" data-tab="compoff">Compensatory Request</button>
  </nav>

  <main class="content">

    <section class="tab-panel is-active" id="tab-summary">

      <!-- STICKY BAR -->
      <div class="summary-bar">
        <div class="summary-bar__info">
          Leave booked this year : <b id="leaveBooked">0</b>
          <span class="divider">|</span>
          Absent : <b id="absentDays">0 day(s)</b>
        </div>

        <div class="year-nav">
          <div class="year-nav__buttons">
            <button class="icon-btn" id="prevYear" title="Previous year">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="icon-btn" title="Calendar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </button>
            <button class="icon-btn" id="nextYear" title="Next year">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <span class="year-nav__range" id="dateRange"></span>
        </div>

        <div class="summary-bar__actions">
          <button class="view-btn is-active" title="List view">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
          </button>
          <button class="view-btn" title="Calendar view">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
          <button class="btn-primary" id="applyLeaveBtn">Apply Leave</button>
          <button class="btn-more" title="More">•••</button>
        </div>
      </div>

      <!-- LEAVE CARDS -->
      <div class="cards" id="cards"></div>

      <!-- ABSENT LIST -->
      <div class="panel">
        <div class="panel__head">
          <b>Absent</b><span class="dot"></span><span id="absentTitle" class="muted"></span>
        </div>
        <div class="absent-rows" id="absentRows"></div>
      </div>

      <!-- UPCOMING / PAST LEAVES & HOLIDAYS -->
      <div class="panel">
        <div class="panel__filter">
          <select id="holidayFilter" class="select">
            <option value="upcoming">Upcoming Leaves &amp; Holidays</option>
            <option value="past">Past Leaves &amp; Holidays</option>
          </select>
        </div>
        <div class="holiday-rows" id="holidayRows"></div>
      </div>

    </section>

    <section class="tab-panel" id="tab-requests">Leave Requests content</section>
    <section class="tab-panel" id="tab-compoff">Compensatory Request content</section>
  </main>

  <!-- ========== APPLY LEAVE FORM (overlay) ========== -->
  <div class="modal" id="applyModal">
    <div class="modal__head">
      <h2>Apply Leave</h2>
      <button class="modal__close" id="applyClose" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="form-card">
        <!-- <div class="form-card__title">Leave</div> -->

        <div class="form-card__title">
          <span class="leave-badge" id="leaveBadge"></span>
          <span id="leaveTitle">Leave</span>
          <span class="balance-chip" id="balanceChip"></span>
        </div>

        <div class="form-card__fields">
          <div class="form-row">
            <label for="fLeaveType">Leave type <span class="req">*</span></label>
            <div class="field">
              <select id="fLeaveType" class="input"></select>
              <div class="error" id="errType"></div>
            </div>
          </div>

          <div class="form-row">
            <label>Date <span class="req">*</span></label>
            <div class="field">
              <div class="date-pair">
                <div class="date-field">
                  <input type="text" id="fFrom" class="input" placeholder="dd-MM-yyyy" readonly>
                  <button type="button" class="date-field__btn" title="Pick date">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                  </button>
                  <input type="date" id="fFromPicker" class="date-field__native" tabindex="-1">
                </div>
                <div class="date-field">
                  <input type="text" id="fTo" class="input" placeholder="dd-MM-yyyy" readonly>
                  <button type="button" class="date-field__btn" title="Pick date">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                  </button>
                  <input type="date" id="fToPicker" class="date-field__native" tabindex="-1">
                </div>
              </div>
              <div class="days-chip" id="daysChip"></div>
              <div class="error" id="errDate"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="fEmail">Team Email ID</label>
            <div class="field">
              <input type="text" id="fEmail" class="input">
              <div class="error" id="errEmail"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="fReason">Reason for leave</label>
            <div class="field">
              <textarea id="fReason" class="input" rows="4"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__foot">
      <button class="btn-primary" id="applySubmit">Submit</button>
      <button class="btn-cancel" id="applyCancel">Cancel</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pages/applyLeave.js"></script>
  <script src="js/pages/leaveSummary.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
